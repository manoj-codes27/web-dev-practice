<body class="bg-yellow-300 min-h-screen items-center  flex justify-center">
    <div class="items-center flex flex-col">

    <h1 class="text-center font-bold font-serif mb-6">Yellowish Login Page(Tailwand)</h1>
      
    <div class=" bg-amber-200 rounded-2xl border-2  border-amber-400 p-8 pl-12 pr-12">
        <h2 class="text-2xl font-semibold font-sans text-center text-amber-900 pt-5">LOGIN</h2>
        <form action="">
           <div>
                <label for="email" class="block">Email:</label>
                <input type="email" placeholder="Enter your email" class="border-amber-900 border-2 mt-2 mb-2 focus:outline-none rounded-sm">
           </div>
           <div>
                <label for="password" class="block">Password:</label>
                <input type="email" placeholder="Enter your Password"  class="border-amber-900 border-2 mt-2 mb-2 focus:outline-none rounded-sm">
           </div>  
           <button class="bg-amber-600 text-amber-200 rounded-md w-full mt-1 mb-1 hover:bg-amber-900 px-1 py-1">Login</button>
        </form>
    </div>
    </div>
